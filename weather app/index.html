<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.2/css/all.css">
    <link rel="stylesheet" href="main.css">
    <title>Weather</title>
</head>
<body>
    <div class="card">

        <div class="card-body">
            <input type="text" id="rech" placeholder="Enter city name" spellcheck="false">
            <button><i class="fas fa-search"></i></button>
        </div>

        <div class="weather">
            <img src="./img/weather.png" alt="weather icon" class="weather-icon">
            <h2 class="city">Agadir</h2>
            <h1 class="temp">25<span class="h1-temp">°C</span></h1>

            <div class="detailse">
                <div class="col">
                    <img src="./img/humidity.png" alt="humidity icon" class="icon-det">
                    <div>
                        <h3>Humidity</h3>
                        <p class="humidity">60%</p>
                    </div>
                </div>

                <div class="col">
                    <img src="./img/wind.png" alt="wind icon" class="icon-det">
                    <div>
                        <h3>Wind</h3>
                        <p class="wind">10 km/h</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
